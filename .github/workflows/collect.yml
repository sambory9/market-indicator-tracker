name: collect

on:
  schedule:
    # 평일 16:10 KST (= 07:10 UTC). GitHub 스케줄은 수 분~수십 분 늦을 수 있다.
    - cron: "10 7 * * 1-5"
    # 토요일 아침 08:10 KST: 금요일 밤 미국장 종가 반영 (일요일 주간 리포트용)
    - cron: "10 23 * * 5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/index.html", "build_dashboard.py"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 수집
        if: github.event_name != 'push'
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python collect.py
      - name: 대시보드 데이터
        run: python build_dashboard.py
      - name: 커밋
        if: github.event_name != 'push'
        run: |
          git config user.name "indicator-bot"
          git config user.email "indicator-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date +%F)"
          git pull --rebase origin main
          git push
      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        if: steps.pages.outcome == 'success'
